name: ui

# O4-4 / the launch gate: the checks that must pass before a release, including **the interface the app actually
# renders**.
#
# One job, because there used to be two and the second one was red and unwatched: a `screenshots` job hand-started
# electron, slept 8 seconds and ran `scripts/screenshots.mjs`, and when it failed nobody saw it. `scripts/verify-ui.mjs`
# now stages a packaged-like layout outside the checkout, launches the app once, reads the live DOM over CDP, fails on a
# named lie, and captures both themes on the way through. One launch, one artifact, one place to look.
#
# `node scripts/screenshots.mjs` still exists for the manual four-surface capture (chat, settings, trace); it needs an
# app that is already running with a debug port, which is exactly what this job no longer asks a human to do by hand.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The double-cast budget, the copy-assertion ratchet and the capability matrix are part of the suite
        run: echo "enforced by npm test (test/security/cast-budget, test/renderer/copy-assertion-ratchet, test/docs)"

      # THE GATE THAT DID NOT EXIST. 3196 unit tests were green while the window showed a green dot next to a dead
      # session, because no test ever ran the app. This launches it and reads what it renders.
      #
      # It is REQUIRED (no `continue-on-error`). Two things are still unproven about a GitHub-hosted runner, and they
      # are announced below instead of swallowed:
      #   * whether a `windows-latest` runner lets the staged, unsigned `electron.exe` execute at all — the launch was
      #     proven on one Windows machine (staging outside `Documents`, `ELECTRON_RUN_AS_NODE` cleared) and nowhere
      #     else, and a runner image may block it or lack a desktop session;
      #   * whether the first-run profile seeded in the staging directory is enough for the shell to reach `ready`.
      # If this step fails on the runner for either reason, the job goes red ON PURPOSE and the log says which one. A
      # red check that names its cause is worth more than a green one nobody earns.
      - name: Say what the live check still cannot prove on a hosted runner
        shell: pwsh
        run: |
          Write-Output "::notice title=Live UI verification::Unproven on a hosted runner: (1) that it executes the staged unsigned electron.exe, (2) that the seeded first-run profile reaches ready. Proven on one Windows machine. A failure here is information, not noise."

      - name: Launch the app and verify what it renders over CDP
        shell: pwsh
        run: node scripts/verify-ui.mjs --port 9222

      # The bugs that were fixed and came back, checked against the app that actually runs. A scenario that cannot be
      # proven reports skipped with its reason and is counted; it is never a pass. Same launch, same staging, so the
      # cost is one more verify run rather than a second environment.
      - name: Run the runtime regression scenarios
        shell: pwsh
        run: node scripts/run-scenarios.mjs --port 9222

      # The captures are the evidence: a failed invariant is a log line, but "what did it look like?" is a PNG. Kept
      # even when the step above fails, which is when they matter most.
      - name: Keep the live captures and their baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-live-verify
          path: |
            docs/screenshots/**/*.png
            docs/screenshots/**/*.baseline
          if-no-files-found: warn
