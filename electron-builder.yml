appId: com.sepid.ai-desktop
productName: AI Desktop
copyright: Copyright © 2026 Sepid_Com

directories:
  buildResources: build
  output: release

# Only the compiled app is shipped. The renderer is fully bundled by Vite and
# the main/preload processes use Electron + Node built-ins, except `ssh2` which
# is loaded lazily and therefore listed below so it ships with the app.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/node_modules/**'
  # ssh2 is the one runtime dependency: it is externalized out of the main
  # bundle (so it is not statically resolvable) and must ship with the app.
  - node_modules/ssh2/**/*
  - node_modules/asn1/**/*
  - node_modules/bcrypt-pbkdf/**/*
  - node_modules/tweetnacl/**/*
  - node_modules/safer-buffer/**/*

asar: true
compression: maximum
# Keeps the packaged package.json free of dev-time scripts and devDependencies.
removePackageScripts: true
removePackageKeywords: true
publish: null

# ssh2 ships a pure-JS fallback; its optional `cpu-features` native module is not
# packaged and cannot be cross-compiled when building the Windows target from
# Linux, so skip the native rebuild entirely.
npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/icon.ico
  # Signing is applied automatically when CSC_LINK / CSC_KEY_PASSWORD (or a
  # certificate in the OS store) are provided; otherwise it is skipped safely.
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Desktop
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName} Setup ${version}.${ext}

portable:
  artifactName: ${productName} ${version} Portable.${ext}
